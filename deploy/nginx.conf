# Every client site: any *.nodepress.brainxdemo.com goes to the website, which finds the site by the
# address visited (the api repo's deploy/README.md, step 7). admin. and api. have their own server
# blocks in those repos, and an exact name wins over this wildcard. The certificate is from step 6.

server {
    listen 80;
    server_name *.nodepress.brainxdemo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.nodepress.brainxdemo.com;

    ssl_certificate     /etc/letsencrypt/live/nodepress.brainxdemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodepress.brainxdemo.com/privkey.pem;

    # Only the API, from inside the server, tells the website to forget a site's pages.
    location = /api/revalidate {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        # The website finds the site by this address, and makes https links from X-Forwarded-Proto.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
